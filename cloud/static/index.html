<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ChronoTrack · Resultados</title>
<style>
  :root { --bg:#0d0f10; --panel:#141618; --panel2:#1c1f21; --border:#2a2e31; --txt:#e8eaeb; --mut:#8a9299; --dim:#525a60; --acc:#00e5a0; --blue:#4d9fff; --warn:#f5a623; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); color:var(--txt); font-family:system-ui,-apple-system,sans-serif; min-height:100vh; }
  a { color:inherit; text-decoration:none; }
  button { font-family:inherit; cursor:pointer; }
  input { font-family:inherit; }

  header { background:var(--panel); border-bottom:1px solid var(--border); padding:0 20px; height:58px; display:flex; align-items:center; gap:16px; position:sticky; top:0; z-index:10; }
  .logo { font-weight:800; font-size:20px; color:var(--acc); letter-spacing:-0.5px; cursor:pointer; }
  .logo span { color:var(--mut); font-weight:400; }
  .nav { margin-left:auto; display:flex; gap:8px; align-items:center; }
  .nav button { background:transparent; border:1px solid var(--border); color:var(--mut); padding:7px 14px; border-radius:7px; font-size:13px; font-weight:600; }
  .nav button:hover { border-color:var(--acc); color:var(--acc); }
  .nav .primary { background:var(--acc); color:#012; border-color:var(--acc); }

  main { max-width:880px; margin:0 auto; padding:28px 20px 60px; }
  h1 { font-size:24px; font-weight:800; margin-bottom:6px; }
  h2 { font-size:18px; font-weight:700; margin:0 0 12px; }
  .sub { color:var(--mut); font-size:14px; margin-bottom:24px; }

  .card { background:var(--panel); border:1px solid var(--border); border-radius:12px; padding:18px; margin-bottom:14px; }
  .card.click { cursor:pointer; transition:border-color .15s, transform .1s; }
  .card.click:hover { border-color:var(--acc); transform:translateY(-1px); }

  .row { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  .pill { background:#4d9fff15; color:var(--blue); border:1px solid #4d9fff30; border-radius:20px; padding:2px 10px; font-size:12px; font-weight:600; }
  .pill.green { background:#00e5a015; color:var(--acc); border-color:#00e5a030; }
  .pill.warn { background:#f5a62315; color:var(--warn); border-color:#f5a62330; }
  .muted { color:var(--mut); font-size:13px; }
  .dim { color:var(--dim); font-size:12px; }

  label { display:block; font-size:11px; text-transform:uppercase; letter-spacing:.5px; color:var(--dim); margin:0 0 5px; }
  .field { margin-bottom:12px; }
  input[type=text],input[type=email],input[type=password] { width:100%; background:var(--panel2); border:1px solid var(--border); border-radius:8px; padding:10px 12px; color:var(--txt); font-size:14px; outline:none; }
  input:focus { border-color:var(--acc); }
  .btn { background:var(--acc); color:#012; border:none; padding:11px 18px; border-radius:8px; font-weight:700; font-size:14px; width:100%; }
  .btn.ghost { background:transparent; border:1px solid var(--border); color:var(--mut); }
  .btn:disabled { opacity:.6; cursor:wait; }

  table { width:100%; border-collapse:collapse; font-size:13px; }
  th { text-align:left; padding:8px 10px; font-size:10px; text-transform:uppercase; letter-spacing:.5px; color:var(--dim); border-bottom:1px solid var(--border); }
  td { padding:9px 10px; border-bottom:1px solid var(--panel2); }
  .pos { font-family:monospace; color:var(--dim); width:42px; }
  .medal0 { color:#f5a623; font-weight:700; } .medal1 { color:#aabbcc; font-weight:700; } .medal2 { color:#cd7c4a; font-weight:700; }
  .bib { font-family:monospace; background:var(--panel2); padding:2px 8px; border-radius:4px; color:var(--mut); font-size:12px; }
  .time { font-family:monospace; color:var(--acc); font-weight:600; text-align:right; white-space:nowrap; }

  .dist-tabs { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:14px; }
  .dist-tabs button { background:transparent; border:2px solid var(--border); color:var(--mut); padding:6px 16px; border-radius:8px; font-size:13px; font-weight:600; }
  .dist-tabs button.on { border-color:var(--acc); color:var(--acc); background:#00e5a015; }

  .err { background:#ff4d4d15; color:#ff6b6b; border:1px solid #ff4d4d30; border-radius:8px; padding:10px 12px; font-size:13px; margin-bottom:12px; }
  .ok { background:#00e5a015; color:var(--acc); border:1px solid #00e5a030; border-radius:8px; padding:10px 12px; font-size:13px; margin-bottom:12px; }
  .empty { text-align:center; padding:50px 20px; color:var(--dim); }
  .empty .ic { font-size:40px; margin-bottom:10px; }
  .back { color:var(--mut); font-size:13px; margin-bottom:14px; display:inline-block; }
  .back:hover { color:var(--acc); }
  .stats { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-bottom:20px; }
  .stat { background:var(--panel); border:1px solid var(--border); border-radius:10px; padding:14px; text-align:center; }
  .stat .v { font-size:24px; font-weight:800; color:var(--acc); }
  .stat .l { font-size:10px; text-transform:uppercase; color:var(--dim); letter-spacing:.5px; margin-top:3px; }
  .tabbar { display:flex; gap:8px; margin-bottom:16px; }
  .tabbar button { flex:1; background:var(--panel2); border:1px solid var(--border); color:var(--mut); padding:9px; border-radius:8px; font-weight:600; font-size:13px; }
  .tabbar button.on { background:var(--acc); color:#012; border-color:var(--acc); }
</style>
</head>
<body>
<header>
  <div class="logo" onclick="go('home')">CHRONO<span>TRACK</span></div>
  <div class="nav" id="nav"></div>
</header>
<main id="app"></main>

<script>
const API = "";  // mismo origen
const $ = (id) => document.getElementById(id);
let TOKEN = localStorage.getItem("ct_token") || null;
let USER  = JSON.parse(localStorage.getItem("ct_user") || "null");
let state = { distFilter: null };

function esc(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function fmtNs(ns){ if(!ns) return "—"; let ms=Math.floor(ns/1e6); const h=Math.floor(ms/3600000); ms%=3600000; const m=Math.floor(ms/60000); ms%=60000; const s=Math.floor(ms/1000); const f=ms%1000; const p=(n,l=2)=>String(n).padStart(l,"0"); return `${p(h)}:${p(m)}:${p(s)}.${p(f,3)}`; }
function fmtDate(d){ if(!d) return ""; try { return new Date(d+"T12:00:00").toLocaleDateString("es-AR",{day:"numeric",month:"long",year:"numeric"}); } catch { return d; } }

async function api(method, path, body, auth){
  const h = {"Content-Type":"application/json"};
  if(auth && TOKEN) h["Authorization"] = "Bearer "+TOKEN;
  const res = await fetch(API+path, { method, headers:h, body: body!=null?JSON.stringify(body):undefined });
  const data = await res.json().catch(()=>null);
  if(!res.ok) throw new Error((data && data.detail) || "Error "+res.status);
  return data;
}

function setSession(d){ TOKEN=d.token; USER={email:d.email,full_name:d.full_name}; localStorage.setItem("ct_token",TOKEN); localStorage.setItem("ct_user",JSON.stringify(USER)); }
function logout(){ TOKEN=null; USER=null; localStorage.removeItem("ct_token"); localStorage.removeItem("ct_user"); go("home"); }

function renderNav(){
  const n = $("nav");
  if(USER){
    n.innerHTML = `<button onclick="go('me')">🏃 Mis resultados</button>
      <span class="muted" style="font-size:12px">${esc(USER.full_name||USER.email)}</span>
      <button onclick="logout()">Salir</button>`;
  } else {
    n.innerHTML = `<button onclick="go('login')">Ingresar</button>
      <button class="primary" onclick="go('register')">Crear cuenta</button>`;
  }
}

// ── Router ────────────────────────────────────────────────────────────────
function go(view, arg){
  state.view = view; state.arg = arg; state.distFilter = null;
  renderNav();
  if(view==="home") return viewHome();
  if(view==="race") return viewRace(arg);
  if(view==="login") return viewAuth("login");
  if(view==="register") return viewAuth("register");
  if(view==="me") return viewMe();
}

// ── Home: lista de carreras + buscar por código ─────────────────────────────
async function viewHome(){
  $("app").innerHTML = `
    <h1>Resultados de carreras</h1>
    <div class="sub">Buscá tu carrera y mirá los tiempos oficiales.</div>
    <div class="card">
      <label>Buscar por código de carrera</label>
      <div class="row">
        <input type="text" id="codeIn" placeholder="ej. 166394" style="flex:1" onkeydown="if(event.key==='Enter')gotoCode()">
        <button class="btn" style="width:auto" onclick="gotoCode()">Ver</button>
      </div>
    </div>
    <h2 style="margin-top:24px">Carreras publicadas</h2>
    <div id="races"><div class="empty">Cargando…</div></div>`;
  try {
    const races = await api("GET","/api/races");
    $("races").innerHTML = races.length ? races.map(r=>`
      <div class="card click" onclick="go('race','${r.code}')">
        <div class="row" style="justify-content:space-between">
          <div style="font-weight:700;font-size:15px">${esc(r.name)}</div>
          <span class="bib">${r.code}</span>
        </div>
        <div class="row" style="margin-top:8px">
          ${r.race_date?`<span class="dim">📅 ${esc(fmtDate(r.race_date))}</span>`:""}
          ${r.location?`<span class="dim">📍 ${esc(r.location)}</span>`:""}
          <span class="pill green">${r.finishers} finishers</span>
          ${r.distances.map(d=>`<span class="pill">${d} km</span>`).join("")}
        </div>
      </div>`).join("") : `<div class="empty"><div class="ic">🏁</div>Todavía no hay carreras publicadas.</div>`;
  } catch(e){ $("races").innerHTML = `<div class="err">${esc(e.message)}</div>`; }
}
function gotoCode(){ const c=$("codeIn").value.trim(); if(c) go("race",c); }

// ── Detalle de carrera ──────────────────────────────────────────────────────
async function viewRace(code){
  $("app").innerHTML = `<a class="back" onclick="go('home')">← Carreras</a><div id="rc"><div class="empty">Cargando…</div></div>`;
  let race;
  try { race = await api("GET","/api/races/"+encodeURIComponent(code)); }
  catch(e){ $("rc").innerHTML = `<div class="err">${esc(e.message)}</div>`; return; }

  const finishers = race.results.filter(r=>r.status==="FINISHER");
  const dnf = race.results.filter(r=>r.status!=="FINISHER");
  const dists = race.distances.length ? race.distances : [...new Set(finishers.map(r=>r.distance_km).filter(x=>x!=null))];
  if(state.distFilter==null && dists.length) state.distFilter = dists[0];

  const renderTable = () => {
    let list = finishers;
    if(dists.length) list = finishers.filter(r=>r.distance_km===state.distFilter);
    list = [...list].sort((a,b)=>(a.net_time_ns||a.finish_time_ns||9e18)-(b.net_time_ns||b.finish_time_ns||9e18));
    const rows = list.map((r,i)=>`
      <tr>
        <td class="pos ${i<3?'medal'+i:''}">${i<3?["🥇","🥈","🥉"][i]:i+1}</td>
        <td><span class="bib">${esc(r.bib_number)}</span></td>
        <td style="font-weight:600">${esc(r.full_name)}</td>
        <td>${r.category?`<span class="pill ${r.category[0]==='F'?'':'green'}">${esc(r.category)}</span>`:'—'}</td>
        <td class="muted">${esc(r.club||'—')}</td>
        <td class="time">${fmtNs(r.net_time_ns||r.finish_time_ns)}</td>
      </tr>`).join("");
    return `<table><thead><tr><th>Pos</th><th>Dorsal</th><th>Nombre</th><th>Cat.</th><th>Club</th><th style="text-align:right">Tiempo</th></tr></thead>
      <tbody>${rows||`<tr><td colspan="6" class="empty">Sin finishers en esta distancia</td></tr>`}</tbody></table>`;
  };

  $("rc").innerHTML = `
    <h1>${esc(race.name)}</h1>
    <div class="sub">${[fmtDate(race.race_date), race.location].filter(Boolean).map(esc).join(" · ")} · código <b>${race.code}</b></div>
    <div class="stats">
      <div class="stat"><div class="v">${finishers.length}</div><div class="l">Finishers</div></div>
      <div class="stat"><div class="v" style="color:var(--txt)">${race.results.length}</div><div class="l">Total</div></div>
      <div class="stat"><div class="v" style="color:var(--warn)">${dnf.length}</div><div class="l">DNF/DNS/DQ</div></div>
    </div>
    ${dists.length>1?`<div class="dist-tabs" id="dtabs">${dists.map(d=>`<button class="${d===state.distFilter?'on':''}" onclick="setDist(${d})">${d} km</button>`).join("")}</div>`:""}
    <div class="card" style="padding:6px 6px" id="tbl">${renderTable()}</div>
    ${USER?`<div class="card"><div class="muted">¿Corriste esta carrera? <a style="color:var(--acc);cursor:pointer" onclick="go('me')">Reclamá tu resultado</a> para guardarlo en tu perfil.</div></div>`:""}`;
  state._renderTable = renderTable;
}
function setDist(d){ state.distFilter=d; $("tbl").innerHTML = state._renderTable(); document.querySelectorAll("#dtabs button").forEach(b=>b.classList.toggle("on", b.textContent===d+" km")); }

// ── Auth ─────────────────────────────────────────────────────────────────────
function viewAuth(mode){
  const reg = mode==="register";
  $("app").innerHTML = `
    <div style="max-width:380px;margin:30px auto">
      <h1>${reg?"Crear cuenta":"Ingresar"}</h1>
      <div class="sub">${reg?"Guardá tus resultados y seguí tu progreso.":"Accedé a tu historial de carreras."}</div>
      <div class="card">
        <div id="amsg"></div>
        ${reg?`<div class="field"><label>Nombre completo</label><input type="text" id="fn" placeholder="Juan Pérez"></div>`:""}
        <div class="field"><label>Email</label><input type="email" id="em" placeholder="vos@email.com"></div>
        <div class="field"><label>Contraseña</label><input type="password" id="pw" placeholder="${reg?'mínimo 6 caracteres':'••••••'}" onkeydown="if(event.key==='Enter')doAuth('${mode}')"></div>
        <button class="btn" id="abtn" onclick="doAuth('${mode}')">${reg?"Crear cuenta":"Ingresar"}</button>
        <div style="text-align:center;margin-top:14px" class="muted">
          ${reg?`¿Ya tenés cuenta? <a style="color:var(--acc);cursor:pointer" onclick="go('login')">Ingresá</a>`
                :`¿Sos nuevo? <a style="color:var(--acc);cursor:pointer" onclick="go('register')">Creá tu cuenta</a>`}
        </div>
      </div>
    </div>`;
}
async function doAuth(mode){
  const reg = mode==="register";
  const email = $("em").value.trim(), pw = $("pw").value;
  const b = $("abtn"); b.disabled=true;
  try {
    const body = reg ? { email, password:pw, full_name:$("fn").value.trim()||null } : { email, password:pw };
    const d = await api("POST", reg?"/api/auth/register":"/api/auth/login", body);
    setSession(d); go("me");
  } catch(e){ $("amsg").innerHTML = `<div class="err">${esc(e.message)}</div>`; b.disabled=false; }
}

// ── Mis resultados ────────────────────────────────────────────────────────────
async function viewMe(){
  if(!USER) return go("login");
  $("app").innerHTML = `<h1>Mi perfil</h1><div class="sub">${esc(USER.full_name||USER.email)}</div>
    <div class="tabbar"><button class="on" id="tHist" onclick="meTab('hist')">Mis carreras</button><button id="tClaim" onclick="meTab('claim')">Reclamar resultado</button></div>
    <div id="meBody"><div class="empty">Cargando…</div></div>`;
  meTab("hist");
}
async function meTab(tab){
  $("tHist").classList.toggle("on", tab==="hist");
  $("tClaim").classList.toggle("on", tab==="claim");
  if(tab==="claim") return renderClaim();
  try {
    const d = await api("GET","/api/me/results",null,true);
    const pb = d.personal_bests.length ? `<div class="card"><h2>Mejores marcas</h2><div class="row">${d.personal_bests.map(p=>`<div class="stat" style="min-width:120px"><div class="v">${fmtNs(p.net_time_ns)}</div><div class="l">${p.distance_km} km</div></div>`).join("")}</div></div>` : "";
    const hist = d.results.length ? `<div class="card" style="padding:6px"><table><thead><tr><th>Carrera</th><th>Dist.</th><th>Pos.</th><th style="text-align:right">Tiempo</th></tr></thead><tbody>
      ${d.results.map(r=>`<tr>
        <td><a style="color:var(--acc);cursor:pointer" onclick="go('race','${r.race_code}')">${esc(r.race_name)}</a><div class="dim">${esc(fmtDate(r.race_date))}</div></td>
        <td>${r.distance_km?r.distance_km+" km":"—"}</td>
        <td>${r.status==="FINISHER"?(r.position||"—"):`<span class="pill warn">${r.status}</span>`}</td>
        <td class="time">${fmtNs(r.net_time_ns)}</td></tr>`).join("")}
      </tbody></table></div>` : `<div class="empty"><div class="ic">🏃</div>Todavía no reclamaste resultados.<br><a style="color:var(--acc);cursor:pointer" onclick="meTab('claim')">Reclamá tu primera carrera</a></div>`;
    $("meBody").innerHTML = `<div class="stats"><div class="stat"><div class="v">${d.total_races}</div><div class="l">Carreras</div></div><div class="stat"><div class="v">${d.personal_bests.length}</div><div class="l">Distancias</div></div><div class="stat"><div class="v">${d.results.length}</div><div class="l">Resultados</div></div></div>${pb}${hist}`;
  } catch(e){ $("meBody").innerHTML = `<div class="err">${esc(e.message)}</div>`; }
}
function renderClaim(){
  $("meBody").innerHTML = `<div class="card">
    <h2>Reclamar un resultado</h2>
    <div class="muted" style="margin-bottom:14px">Ingresá el código de la carrera, tu número de dorsal y tu apellido.</div>
    <div id="cmsg"></div>
    <div class="field"><label>Código de carrera</label><input type="text" id="cCode" placeholder="ej. 166394"></div>
    <div class="row">
      <div class="field" style="flex:1"><label>Dorsal</label><input type="text" id="cBib" placeholder="101"></div>
      <div class="field" style="flex:2"><label>Apellido</label><input type="text" id="cLast" placeholder="Pérez"></div>
    </div>
    <button class="btn" id="cBtn" onclick="doClaim()">Reclamar</button>
  </div>`;
}
async function doClaim(){
  const b=$("cBtn"); b.disabled=true;
  try {
    const d = await api("POST","/api/claim",{ code:$("cCode").value.trim(), bib_number:$("cBib").value.trim(), last_name:$("cLast").value.trim() }, true);
    $("cmsg").innerHTML = `<div class="ok">✓ ${d.linked} resultado(s) vinculado(s) de "${esc(d.race)}".</div>`;
    setTimeout(()=>meTab("hist"), 900);
  } catch(e){ $("cmsg").innerHTML = `<div class="err">${esc(e.message)}</div>`; b.disabled=false; }
}

// init
renderNav();
go("home");
</script>
</body>
</html>
