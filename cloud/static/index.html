<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LiveRun · Resultados</title>
<script>document.documentElement.setAttribute("data-theme",localStorage.getItem("ct_theme")==="light"?"light":"dark");</script>
<link rel="icon" type="image/svg+xml" href="/logo.svg">
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<div class="layout">
  <aside class="sidebar">
    <div class="logo" onclick="go('home')"><img class="logo-mark" src="/logo.svg" alt="" width="26" height="26">LIVE<span>RUN</span></div>
    <div class="side-search">
      <input id="hq" placeholder="🔎 Buscar corredor o carrera…" onkeydown="if(event.key==='Enter')headerSearch()">
    </div>
    <nav class="side-nav" id="nav"></nav>
    <div class="side-foot">
      <div id="account"></div>
      <button id="themeBtn" class="theme-toggle" onclick="toggleTheme()" title="Cambiar tema" aria-label="Cambiar tema claro u oscuro">◐ Tema</button>
    </div>
  </aside>
  <div class="content">
    <main id="app"></main>
    <footer>
      <div class="logo"><img class="logo-mark" src="/logo.svg" alt="" width="20" height="20">LIVE<span>RUN</span></div>
      <div>Resultados oficiales de cronometraje · Hecho con LiveRun</div>
    </footer>
  </div>
</div>
<script src="/app.js"></script>
</body>
</html>
