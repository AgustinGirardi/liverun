name: EAS Update (OTA)

# Publica un update OTA cada vez que cambia algo en mobile/ y se hace push.
# La app (Expo Go o un build con expo-updates) toma el último update al abrir,
# sin necesidad de `npx expo start`. Solo aplica a cambios JS/assets; lo nativo
# necesita rebuild. Requiere el secret EXPO_TOKEN (expo.dev → Access Tokens).

on:
  push:
    branches: [main]   # solo main publica OTA (antes cualquier rama iba a prod)
    paths:
      - 'mobile/**'
      - '.github/workflows/eas-update.yml'
  workflow_dispatch: {}

# Para que un build lo reciba tienen que coincidir el canal (`preview` → branch
# `main`, se mapea con `eas channel:edit preview --branch main`) y el
# runtimeVersion (política `fingerprint`: un build viejo ignora el update).
# Paso a paso en mobile/README.md → "Que la OTA llegue al teléfono".
#
# OJO para los builds de tienda: usan canal "production" (eas.json). Antes de
# publicar en App Store/Play, mapear ese canal a este branch
# (`eas channel:edit production --branch main`) o publicar también a un branch
# "production"; si no, los usuarios de tienda no reciben estos OTA.

concurrency:
  group: eas-update
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - name: Publicar update OTA (branch "main")
        run: npx eas-cli@latest update --branch main --message "$MSG" --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          MSG: ${{ github.event.head_commit.message || 'manual dispatch' }}
