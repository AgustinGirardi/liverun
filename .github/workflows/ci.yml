name: CI

# Verifica cada push y cada PR: tests, lint y tipos de las tres piezas, más el
# build del frontend y la auditoría de dependencias de Python.
#
# Un push a main que toca el portal lo despliega en Cloud Run (job deploy-portal),
# y solo si pasan los tests de Python contra SQLite y contra Postgres. Mientras
# no estén cargadas las variables del repo (GCP_PROJECT_ID, ver DEPLOY.md) ese job
# se saltea. Render sigue desplegando por su cuenta (autoDeploy) hasta la baja.

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python (portal + escritorio)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"   # el mismo que PYTHON_VERSION en render.yaml
          cache: pip
          cache-dependency-path: |
            cloud/requirements.lock
            requirements.lock
            requirements-dev.txt
      - name: Instalar dependencias (los locks, no los pisos)
        run: pip install -r cloud/requirements.lock -r requirements.lock -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Formato
        run: ruff format --check .
      - name: Tests
        run: python -m pytest cloud/tests backend/tests -q
      - name: Vulnerabilidades en las dependencias fijadas
        run: |
          pipx run pip-audit==2.10.1 --no-deps --disable-pip -r cloud/requirements.lock
          pipx run pip-audit==2.10.1 --no-deps --disable-pip -r requirements.lock

  python-postgres:
    name: Portal contra Postgres
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: portal_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CT_TEST_DB: postgresql+psycopg://postgres:ci@localhost:5432/portal_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            cloud/requirements.lock
            requirements-dev.txt
      - name: Instalar dependencias del portal
        run: pip install -r cloud/requirements.lock -r requirements-dev.txt
      - name: Tests del portal (mismo conjunto, otro motor)
        run: python -m pytest cloud/tests -q

  deploy-portal:
    name: Desplegar el portal en Cloud Run
    needs: [python, python-postgres]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.GCP_PROJECT_ID != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # Workload Identity Federation: sin claves JSON en el repo
    env:
      REGION: us-east4
      SERVICIO: liverun-portal
      IMAGEN: us-east4-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/liverun/portal:${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: ¿Cambió algo que va en la imagen?
        id: cambios
        run: |
          antes="${{ github.event.before }}"
          if [ -z "$antes" ] || [ "$antes" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$antes" 2>/dev/null; then
            echo "portal=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "$antes" "${{ github.sha }}" | grep -qE '^(cloud/|Dockerfile$|\.dockerignore$|\.github/workflows/ci\.yml$)'; then
            echo "portal=true" >> "$GITHUB_OUTPUT"
          else
            echo "portal=false" >> "$GITHUB_OUTPUT"
            echo "El push no toca el portal: no se despliega."
          fi
      - if: steps.cambios.outputs.portal == 'true'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - if: steps.cambios.outputs.portal == 'true'
        uses: google-github-actions/setup-gcloud@v2
      - if: steps.cambios.outputs.portal == 'true'
        name: Construir y subir la imagen
        run: |
          gcloud auth configure-docker us-east4-docker.pkg.dev --quiet
          docker build -t "$IMAGEN" .
          docker push "$IMAGEN"
      - if: steps.cambios.outputs.portal == 'true'
        name: Desplegar
        run: |
          gcloud run deploy "$SERVICIO" \
            --project "${{ vars.GCP_PROJECT_ID }}" --region "$REGION" \
            --image "$IMAGEN" \
            --service-account "liverun-portal@${{ vars.GCP_PROJECT_ID }}.iam.gserviceaccount.com" \
            --allow-unauthenticated --port 8080 \
            --execution-environment gen2 \
            --min-instances 0 --max-instances 1 --concurrency 80 \
            --memory 512Mi --cpu 1 --cpu-boost --timeout 60 \
            --set-env-vars "CT_PUBLIC_URL=${{ vars.CT_PUBLIC_URL }},CT_ADMIN_EMAILS=${{ vars.CT_ADMIN_EMAILS }}" \
            --set-secrets "CT_CLOUD_DB=ct-cloud-db:latest,CT_CLOUD_SECRET=ct-cloud-secret:latest,CT_PUBLISH_KEY=ct-publish-key:latest,CT_MP_ACCESS_TOKEN=ct-mp-access-token:latest,CT_MP_WEBHOOK_SECRET=ct-mp-webhook-secret:latest,CT_GOOGLE_CLIENT_ID=ct-google-client-id:latest,CT_GOOGLE_CLIENT_SECRET=ct-google-client-secret:latest,CT_SMTP_HOST=ct-smtp-host:latest,CT_SMTP_PORT=ct-smtp-port:latest,CT_SMTP_USER=ct-smtp-user:latest,CT_SMTP_PASSWORD=ct-smtp-password:latest,CT_SMTP_FROM=ct-smtp-from:latest" \
            --add-volume "name=avatars,type=cloud-storage,bucket=${{ vars.GCS_AVATARS_BUCKET }}" \
            --add-volume-mount "volume=avatars,mount-path=/data/avatars" \
            --startup-probe "httpGet.path=/api/health,httpGet.port=8080,timeoutSeconds=10,periodSeconds=10,failureThreshold=12" \
            --liveness-probe "httpGet.path=/api/health,httpGet.port=8080,timeoutSeconds=10,periodSeconds=30"
      - if: steps.cambios.outputs.portal == 'true'
        name: Comprobar que el servicio nuevo está sano
        run: |
          url="$(gcloud run services describe "$SERVICIO" --project "${{ vars.GCP_PROJECT_ID }}" --region "$REGION" --format 'value(status.url)')"
          for i in $(seq 1 12); do
            r="$(curl -s -m 30 "$url/api/health" || true)"
            echo "intento $i: $r"
            [ "$r" = '{"status":"ok"}' ] && exit 0
            sleep 10
          done
          echo "El servicio desplegado no respondió /api/health" >&2
          exit 1

  mobile:
    name: Móvil (Expo)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - name: Tests
        run: npm test -- --ci
      - name: Lint
        run: npm run lint
      - name: Tipos
        run: npx tsc --noEmit

  frontend:
    name: Escritorio (frontend React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4   # el build lee ../version.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build
